# Deploy Frontend to S3 + CloudFront
#
# 브랜치별 배포:
#   deploy/dev  push → dev 환경 배포
#   deploy/prod push → prod 환경 배포
#
# ──────────────────────────────────────────────
# AWS OIDC 설정 가이드
# ──────────────────────────────────────────────
# 1. AWS IAM > Identity providers > Add provider
#    - Provider type: OpenID Connect
#    - Provider URL: https://token.actions.githubusercontent.com
#    - Audience: sts.amazonaws.com
#
# 2. IAM Role 생성 (dev/prod 각각)
#    Trust policy:
#    {
#      "Version": "2012-10-17",
#      "Statement": [{
#        "Effect": "Allow",
#        "Principal": {
#          "Federated": "arn:aws:iam::<ACCOUNT_ID>:oidc-provider/token.actions.githubusercontent.com"
#        },
#        "Action": "sts:AssumeRoleWithWebIdentity",
#        "Condition": {
#          "StringEquals": {
#            "token.actions.githubusercontent.com:aud": "sts.amazonaws.com"
#          },
#          "StringLike": {
#            "token.actions.githubusercontent.com:sub": "repo:<ORG>/<REPO>:environment:<dev|prod>"
#          }
#        }
#      }]
#    }
#
#    Permissions policy:
#    - s3:PutObject, s3:DeleteObject, s3:ListBucket (해당 버킷)
#    - cloudfront:CreateInvalidation (해당 Distribution)
#
# 3. GitHub repo > Settings > Environments
#    - "dev", "prod" 환경 생성
#    - 각 환경에 아래 secrets/variables 설정:
#      Secrets: AWS_ROLE_ARN
#      Variables: AWS_REGION, S3_BUCKET, CLOUDFRONT_DISTRIBUTION_ID,
#                 PUBLIC_API_BASE_URL, PUBLIC_KAKAO_CLIENT_ID,
#                 PUBLIC_KAKAO_REDIRECT_URI, PUBLIC_NAVER_CLIENT_ID,
#                 PUBLIC_NAVER_REDIRECT_URI, PUBLIC_GOOGLE_CLIENT_ID,
#                 PUBLIC_GOOGLE_REDIRECT_URI
# ──────────────────────────────────────────────

name: Deploy Frontend

on:
  push:
    branches:
      - deploy/dev
      - deploy/prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    environment: ${{ github.ref_name == 'deploy/prod' && 'prod' || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_API_BASE_URL: ${{ vars.PUBLIC_API_BASE_URL }}
          PUBLIC_KAKAO_CLIENT_ID: ${{ vars.PUBLIC_KAKAO_CLIENT_ID }}
          PUBLIC_KAKAO_REDIRECT_URI: ${{ vars.PUBLIC_KAKAO_REDIRECT_URI }}
          PUBLIC_NAVER_CLIENT_ID: ${{ vars.PUBLIC_NAVER_CLIENT_ID }}
          PUBLIC_NAVER_REDIRECT_URI: ${{ vars.PUBLIC_NAVER_REDIRECT_URI }}
          PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.PUBLIC_GOOGLE_CLIENT_ID }}
          PUBLIC_GOOGLE_REDIRECT_URI: ${{ vars.PUBLIC_GOOGLE_REDIRECT_URI }}

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

          aws s3 cp dist/index.html s3://${{ vars.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"

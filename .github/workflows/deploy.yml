name: Deploy Frontend

on:
  push:
    branches:
      - deploy/dev
      - deploy/prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    environment: ${{ github.ref_name == 'deploy/prod' && 'prod' || 'dev' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Fetch config from Parameter Store
        run: |
          ENV=${{ github.ref_name == 'deploy/prod' && 'prod' || 'dev' }}

          aws ssm get-parameters-by-path \
            --path "/${ENV}/front" \
            --query "Parameters[*].[Name,Value]" \
            --output text | while IFS=$'\t' read -r name value; do
              key=$(echo "$name" | awk -F/ '{print $NF}')
              echo "${key}=${value}" >> "$GITHUB_ENV"
            done

      - name: Build
        run: npm run build
        env:
          PUBLIC_API_BASE_URL: ${{ env.PUBLIC_API_BASE_URL }}
          PUBLIC_KAKAO_CLIENT_ID: ${{ env.PUBLIC_KAKAO_CLIENT_ID }}
          PUBLIC_KAKAO_REDIRECT_URI: ${{ env.PUBLIC_KAKAO_REDIRECT_URI }}
          PUBLIC_NAVER_CLIENT_ID: ${{ env.PUBLIC_NAVER_CLIENT_ID }}
          PUBLIC_NAVER_REDIRECT_URI: ${{ env.PUBLIC_NAVER_REDIRECT_URI }}
          PUBLIC_GOOGLE_CLIENT_ID: ${{ env.PUBLIC_GOOGLE_CLIENT_ID }}
          PUBLIC_GOOGLE_REDIRECT_URI: ${{ env.PUBLIC_GOOGLE_REDIRECT_URI }}

      - name: Upload to S3
        run: |
          aws s3 sync dist/ s3://${{ env.S3_BUCKET }} \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude "index.html"

          aws s3 cp dist/index.html s3://${{ env.S3_BUCKET }}/index.html \
            --cache-control "no-cache, no-store, must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
